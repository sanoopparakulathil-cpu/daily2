name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Daylog.apk
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Daylog-apk
          path: Daylog.apk
          if-no-files-found: error
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Daylog latest APK
          files: Daylog.apk
