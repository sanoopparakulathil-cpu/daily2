name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show the errors
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo ""
            echo "### Compile errors"
            echo '```'
            grep -E "^e: |^w: .*error|error:" build.log | head -40 || echo "none found"
            echo '```'
            echo ""
            echo "### What went wrong"
            echo '```'
            sed -n '/FAILURE: Build failed/,/^\* Try:/p' build.log | head -40
            echo '```'
            echo ""
            echo "### Last 60 lines"
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Daylog.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Daylog-apk
          path: Daylog.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Daylog latest APK
          files: Daylog.apk
